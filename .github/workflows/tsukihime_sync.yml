name: Tsukihime Group 12 to Telegram Sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan and backfill all releases into Convex'
        required: false
        default: false
        type: boolean

concurrency:
  group: tsukihime-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync_workload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tsukihime Workload
        id: sync_step
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PIPELINE_BOT_TOKEN: ${{ secrets.TELEGRAM_PIPELINE_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STRING_SESSION_2: ${{ secrets.TELEGRAM_STRING_SESSION_2 || secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL_TSUKIHIME: ${{ secrets.TELEGRAM_CHANNEL_TSUKIHIME }}
          TSUKIHIME_GROUP_ID: "12"
          MIN_SEEDERS: "10"
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.scan_all }}" = "true" ]; then
            EXTRA_ARGS="--scan-all"
          fi
          python workers/tsukihime_sync.py --single-video $EXTRA_ARGS | tee tsukihime_output.log
          if grep -q "RESULT_HAS_MORE_VIDEOS=true" tsukihime_output.log; then
            echo "has_more=true" >> $GITHUB_OUTPUT
          else
            echo "has_more=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Trigger Next Workload
        if: steps.sync_step.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh workflow run tsukihime_sync.yml
