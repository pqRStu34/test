name: SubsPlease Telegram Uploader

on:
  workflow_dispatch:

concurrency:
  group: subsplease-uploader
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  upload_workload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Utilities (aria2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SubsPlease Video Workload
        id: upload_step
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_SUBSPLEASE: ${{ secrets.TELEGRAM_CHANNEL_SUBSPLEASE }}
        run: |
          python workers/subsplease_uploader.py --single-video | tee upload_output.log
          if grep -q "RESULT_HAS_MORE_VIDEOS=true" upload_output.log; then
            echo "has_more=true" >> $GITHUB_OUTPUT
          else
            echo "has_more=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Trigger Next Workload
        if: steps.upload_step.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Workload saved to Convex. Dispatching next release in 30 seconds..."
          sleep 30
          gh workflow run subsplease_upload.yml
