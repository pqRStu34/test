name: Telegram to Internet Archive Sync (PocketBase)

on:
  workflow_dispatch:

concurrency:
  group: telegram-ia-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ia_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore PocketBase Database
        run: |
          mkdir -p pb_data
          git fetch origin pocketbase-data:pocketbase-data || true
          git show pocketbase-data:data.db > pb_data/data.db 2>/dev/null || true

      - name: Install & Launch PocketBase
        run: |
          PB_VERSION="0.22.20"
          curl -sL "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip" -o pb.zip
          unzip -o pb.zip pocketbase
          chmod +x pocketbase
          ./pocketbase serve --http=127.0.0.1:8090 --dir=./pb_data &
          sleep 3
          curl -s "http://127.0.0.1:8090/api/health" || true

      - name: Run Telegram to Internet Archive Workload
        id: sync_step
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STRING_SESSION_3: ${{ secrets.TELEGRAM_STRING_SESSION_3 || secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHANNEL_IA_SOURCE: ${{ secrets.TELEGRAM_CHANNEL_IA_SOURCE || secrets.TELEGRAM_CHANNEL_ID }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_ITEM_IDENTIFIER: ${{ secrets.IA_ITEM_IDENTIFIER }}
          FILESTREAM_BASE_URL: ${{ secrets.FILESTREAM_BASE_URL }}
          POCKETBASE_URL: "http://127.0.0.1:8090"
          MAX_RUNTIME_SECONDS: "18900"
        run: |
          python workers/telegram_ia_sync.py | tee sync_output.log
          if grep -q "RESULT_HAS_MORE_VIDEOS=true" sync_output.log; then
            echo "has_more=true" >> $GITHUB_OUTPUT
          else
            echo "has_more=false" >> $GITHUB_OUTPUT
          fi

      - name: Persist PocketBase Database
        if: always()
        run: |
          if [ -f pb_data/data.db ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B pocketbase-data
            cp pb_data/data.db ./data.db
            git add -f data.db
            git diff --staged --quiet || (git commit -m "auto: persist pocketbase database [skip ci]" && git push origin pocketbase-data --force)
            git checkout main
          fi

      - name: Auto-Trigger Next Workload
        if: steps.sync_step.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh workflow run telegram_ia_sync.yml
